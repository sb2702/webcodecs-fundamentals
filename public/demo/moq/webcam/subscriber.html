<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoQ Subscriber</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f8f9fa;
    }

    .container {
      max-width: 100%;
    }

    h3 {
      margin: 0 0 10px 0;
      color: #2d3748;
      font-size: 16px;
    }

    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      background: #f7fafc;
      font-size: 13px;
      font-weight: 500;
    }

    .status.connected {
      background: #c6f6d5;
      border-color: #9ae6b4;
      color: #22543d;
    }

    .status.error {
      background: #fed7d7;
      border-color: #fc8181;
      color: #742a2a;
    }

    .log {
      background: #1a202c;
      color: #e2e8f0;
      padding: 8px;
      border-radius: 4px;
      max-height: 120px;
      overflow-y: auto;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 10px;
      margin-top: 10px;
    }

    .log-entry {
      margin: 3px 0;
      padding: 3px;
      border-left: 3px solid transparent;
      padding-left: 8px;
    }

    .log-entry.info { border-left-color: #4299e1; }
    .log-entry.success { border-left-color: #48bb78; }
    .log-entry.error { border-left-color: #f56565; }

    .log-entry .timestamp {
      color: #a0aec0;
      margin-right: 8px;
      font-size: 10px;
    }

    canvas {
      width: 100%;
      max-width: 300px;
      border-radius: 4px;
      margin: 10px 0;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>📥 Subscriber</h3>
    <div id="status" class="status">Initializing...</div>

    <canvas id="canvas" width="640" height="360"></canvas>

    <div class="log" id="log"></div>
  </div>

  <script type="module">
    import * as Moq from 'https://esm.sh/@moq/net@0.4.2';
    import { MoqSubscriber, AudioPlayer, Hang } from 'https://cdn.jsdelivr.net/npm/webcodecs-examples@0.1.18/dist/index.js';

    // Get URL parameters
    const params = new URLSearchParams(window.location.search);
    const relayUrl = params.get('relay') || 'https://cdn.moq.dev/anon';
    const broadcastName = Hang.broadcastName(params.get('broadcast') || 'my-broadcast');

    // UI Elements
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // State
    let connection = null;
    let subscriber = null;
    let frameCount = 0;

    // Logging
    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(`[${type.toUpperCase()}] ${message}`);
    }

    function updateStatus(message, type = 'info') {
      statusEl.textContent = message;
      statusEl.className = 'status';
      if (type === 'success') statusEl.className = 'status connected';
      if (type === 'error') statusEl.className = 'status error';
    }

    // Resolves once the publisher has announced the broadcast on the relay. Without
    // `announced: true` the request resolves blindly, and subscribing before the
    // publisher announces is reset with code 54 (Unroutable)
    async function waitForBroadcast(request) {
      let active = request.active.peek();
      while (!active) active = await request.active.changed();
      return active;
    }

    async function init() {
      try {
        updateStatus('Connecting to relay...', 'info');
        const origin = new Moq.Origin.Producer();
        connection = await Moq.Connection.connect({ url: new URL(relayUrl), consume: origin });
        log('Connected to relay', 'success');

        updateStatus('Waiting for broadcast...', 'info');
        const broadcast = await waitForBroadcast(origin.request(Moq.Path.from(broadcastName), { announced: true }));
        log(`Consuming broadcast: ${broadcastName}`, 'info');

        const catalog = await MoqSubscriber.getCatalog(broadcast);
        log('Received catalog', 'success');
        console.log('Catalog:', catalog);

        updateStatus('Starting decoders...', 'info');

        // Create audio player for the audio rendition the subscriber will pick
        const [, audioRendition] = Hang.firstRendition(catalog.audio?.renditions);
        const audioPlayer = new AudioPlayer(audioRendition.sampleRate, audioRendition.numberOfChannels);

        // Subscribes to the tracks named in the catalog
        subscriber = new MoqSubscriber(catalog, broadcast);

        // Start video decoding and rendering
        await subscriber.startVideo((frame) => {
          ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
          frame.close();
          frameCount++;
        });

        // Start audio decoding and playback
        await subscriber.startAudio((audioData) => {
          audioPlayer.play(audioData);
          audioData.close();
        });

        updateStatus('✓ Receiving stream', 'success');
        log('Decoders started', 'success');

      } catch (error) {
        updateStatus('Connection failed', 'error');
        log('Init error: ' + error.message, 'error');
      }
    }

    // Initialize
    init();
  </script>
</body>
</html>
